
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .search-box button {
            padding: 12px 22px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #0056b3;
        }

        .product-list {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }

        .product h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .product p {
            color: #007bff;
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
            color: red;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Danh sách sản phẩm</h1>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Nhập tên sản phẩm..."
                autocomplete="off"
            >

            <button id="searchButton">Tìm kiếm</button>
        </div>

        <div id="productList" class="product-list"></div>

        <p id="message" class="message" role="status"
           aria-live="polite"></p>
    </div>

    <script>
        const products = [
            { id: 1, name: "iPhone 15", price: 20000000 },
            { id: 2, name: "Samsung Galaxy S24", price: 18000000 },
            { id: 3, name: "MacBook Air M2", price: 25000000 },
            { id: 4, name: "Tai nghe AirPods Pro", price: 5500000 },
            { id: 5, name: "Laptop Dell XPS", price: 30000000 },
            { id: 6, name: "iPad Air", price: 15000000 }
        ];

        const productList =
            document.getElementById("productList");

        const searchInput =
            document.getElementById("searchInput");

        const searchButton =
            document.getElementById("searchButton");

        const message =
            document.getElementById("message");

        function displayProducts(productArray) {
            productList.replaceChildren();
            message.textContent = "";

            if (productArray.length === 0) {
                message.textContent =
                    "Không tìm thấy sản phẩm phù hợp!";
                return;
            }

            productArray.forEach(product => {
                const card = document.createElement("div");
                card.className = "product";

                const name = document.createElement("h3");
                name.textContent = product.name;

                const price = document.createElement("p");
                price.textContent =
                    product.price.toLocaleString("vi-VN") + " VNĐ";

                card.appendChild(name);
                card.appendChild(price);

                productList.appendChild(card);
            });
        }

        function searchProducts() {
            const keyword = searchInput.value
                .trim()
                .toLocaleLowerCase("vi");

            const result = products.filter(product =>
                product.name
                    .toLocaleLowerCase("vi")
                    .includes(keyword)
            );

            displayProducts(result);
        }

        searchButton.addEventListener(
            "click",
            searchProducts
        );

        searchInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                searchProducts();
            }
        });

        displayProducts(products);

    </script>

</body>
</html>
